<svg viewBox="0 0 720 890" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="890" fill="#FFFFFF"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Algoritma Login</text>

  <rect x="150" y="45" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="260" y="76" text-anchor="middle" font-size="15" fill="#FFFFFF">Mulai</text>
  <line x1="260" y1="95" x2="260" y2="130" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="90" y="130" width="340" height="55" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="163" text-anchor="middle" font-size="14" fill="#1E293B">Input username/NIS &amp; password</text>
  <line x1="260" y1="185" x2="260" y2="220" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="70" y="220" width="380" height="55" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="253" text-anchor="middle" font-size="14" fill="#1E293B">Cari data user pada tabel "user"</text>
  <line x1="260" y1="275" x2="260" y2="310" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <polygon points="260,310 400,375 260,440 120,375" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="260" y="368" text-anchor="middle" font-size="13" fill="#78350F">User</text>
  <text x="260" y="386" text-anchor="middle" font-size="13" fill="#78350F">ditemukan?</text>

  <line x1="260" y1="440" x2="260" y2="475" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="460" font-size="12" fill="#334155">Ya</text>

  <line x1="400" y1="375" x2="470" y2="375" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="405" y="365" font-size="12" fill="#334155">Tidak</text>
  <rect x="470" y="345" width="220" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="580" y="370" text-anchor="middle" font-size="13" fill="#7F1D1D">Tampilkan pesan:</text>
  <text x="580" y="388" text-anchor="middle" font-size="13" fill="#7F1D1D">"User tidak ditemukan"</text>
  <line x1="580" y1="405" x2="580" y2="440" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="440" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="580" y="471" text-anchor="middle" font-size="14" fill="#FFFFFF">Selesai</text>

  <polygon points="260,475 400,540 260,605 120,540" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="260" y="533" text-anchor="middle" font-size="13" fill="#78350F">Password</text>
  <text x="260" y="551" text-anchor="middle" font-size="13" fill="#78350F">cocok?</text>

  <line x1="260" y1="605" x2="260" y2="640" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="625" font-size="12" fill="#334155">Ya</text>

  <line x1="400" y1="540" x2="470" y2="540" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="405" y="530" font-size="12" fill="#334155">Tidak</text>
  <rect x="470" y="510" width="220" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="580" y="535" text-anchor="middle" font-size="13" fill="#7F1D1D">Tampilkan pesan:</text>
  <text x="580" y="553" text-anchor="middle" font-size="13" fill="#7F1D1D">"Password salah"</text>
  <line x1="580" y1="570" x2="580" y2="605" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="605" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="580" y="636" text-anchor="middle" font-size="14" fill="#FFFFFF">Selesai</text>

  <rect x="90" y="640" width="340" height="55" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="673" text-anchor="middle" font-size="14" fill="#1E293B">Simpan session (id_user, level)</text>
  <line x1="260" y1="695" x2="260" y2="730" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="60" y="730" width="400" height="55" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="763" text-anchor="middle" font-size="14" fill="#1E293B">Arahkan ke dashboard sesuai level</text>
  <line x1="260" y1="785" x2="260" y2="820" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="150" y="820" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="260" y="851" text-anchor="middle" font-size="15" fill="#FFFFFF">Selesai</text>
</svg>
