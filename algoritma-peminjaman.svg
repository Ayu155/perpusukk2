<svg viewBox="0 0 720 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="700" fill="#FFFFFF"/>
  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">Algoritma Pengajuan Peminjaman (Siswa)</text>

  <rect x="150" y="45" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="260" y="76" text-anchor="middle" font-size="15" fill="#FFFFFF">Mulai</text>
  <line x1="260" y1="95" x2="260" y2="130" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="110" y="130" width="300" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="160" text-anchor="middle" font-size="14" fill="#1E293B">Siswa memilih buku</text>
  <line x1="260" y1="180" x2="260" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="215" width="360" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="245" text-anchor="middle" font-size="14" fill="#1E293B">Siswa mengajukan peminjaman</text>
  <line x1="260" y1="265" x2="260" y2="300" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <polygon points="260,300 400,365 260,430 120,365" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="260" y="360" text-anchor="middle" font-size="13" fill="#78350F">Stok</text>
  <text x="260" y="378" text-anchor="middle" font-size="13" fill="#78350F">tersedia?</text>

  <line x1="260" y1="430" x2="260" y2="465" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="450" font-size="12" fill="#334155">Ya</text>

  <line x1="400" y1="365" x2="470" y2="365" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="405" y="355" font-size="12" fill="#334155">Tidak</text>
  <rect x="470" y="335" width="220" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="580" y="360" text-anchor="middle" font-size="13" fill="#7F1D1D">Tampilkan pesan:</text>
  <text x="580" y="378" text-anchor="middle" font-size="13" fill="#7F1D1D">"Stok buku habis"</text>
  <line x1="580" y1="395" x2="580" y2="430" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="470" y="430" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="580" y="461" text-anchor="middle" font-size="14" fill="#FFFFFF">Selesai</text>

  <rect x="70" y="465" width="380" height="55" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="498" text-anchor="middle" font-size="14" fill="#1E293B">Simpan pengajuan, status = "menunggu"</text>
  <line x1="260" y1="520" x2="260" y2="555" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="60" y="555" width="400" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="585" text-anchor="middle" font-size="14" fill="#1E293B">Tampilkan: "Pengajuan berhasil dikirim"</text>
  <line x1="260" y1="605" x2="260" y2="635" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="150" y="635" width="220" height="45" rx="22" fill="#4F46E5"/>
  <text x="260" y="663" text-anchor="middle" font-size="14" fill="#FFFFFF">Selesai</text>
