<svg viewBox="0 0 760 940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="940" fill="#FFFFFF"/>
  <text x="380" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1E293B">Algoritma Pengembalian &amp; Denda</text>

  <rect x="170" y="45" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="280" y="76" text-anchor="middle" font-size="15" fill="#FFFFFF">Mulai</text>
  <line x1="280" y1="95" x2="280" y2="130" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="130" width="400" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="160" text-anchor="middle" font-size="14" fill="#1E293B">Input tanggal pengembalian &amp; kondisi buku</text>
  <line x1="280" y1="180" x2="280" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="215" width="400" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="245" text-anchor="middle" font-size="14" fill="#1E293B">Hitung denda keterlambatan (jika ada)</text>
  <line x1="280" y1="265" x2="280" y2="300" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="300" width="400" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="330" text-anchor="middle" font-size="14" fill="#1E293B">Hitung denda berdasarkan kondisi buku</text>
  <line x1="280" y1="350" x2="280" y2="385" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="60" y="385" width="440" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="415" text-anchor="middle" font-size="14" fill="#1E293B">total_denda = denda_telat + denda_kondisi</text>
  <line x1="280" y1="435" x2="280" y2="470" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="470" width="480" height="55" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="497" text-anchor="middle" font-size="14" fill="#1E293B">Update status = "dikembalikan"</text>
  <text x="280" y="515" text-anchor="middle" font-size="14" fill="#1E293B">simpan denda &amp; kondisi</text>
  <line x1="280" y1="525" x2="280" y2="560" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <polygon points="280,560 430,630 280,700 130,630" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="280" y="623" text-anchor="middle" font-size="13" fill="#78350F">Kondisi buku</text>
  <text x="280" y="641" text-anchor="middle" font-size="13" fill="#78350F">= "Hilang"?</text>

  <line x1="280" y1="700" x2="280" y2="735" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="298" y="720" font-size="12" fill="#334155">Tidak</text>

  <line x1="430" y1="630" x2="530" y2="630" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="435" y="620" font-size="12" fill="#334155">Ya</text>
  <rect x="530" y="600" width="200" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="630" y="623" text-anchor="middle" font-size="12.5" fill="#7F1D1D">stok_total -1</text>
  <text x="630" y="641" text-anchor="middle" font-size="12.5" fill="#7F1D1D">(stok_tersedia tetap)</text>
  <line x1="630" y1="660" x2="630" y2="695" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="530" y="695" width="200" height="50" rx="25" fill="#4F46E5"/>
  <text x="630" y="726" text-anchor="middle" font-size="14" fill="#FFFFFF">Selesai</text>

  <rect x="130" y="735" width="300" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="280" y="765" text-anchor="middle" font-size="14" fill="#1E293B">stok_tersedia = stok_tersedia + 1</text>
  <line x1="280" y1="785" x2="280" y2="820" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="170" y="820" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="280" y="851" text-anchor="middle" font-size="15" fill="#FFFFFF">Selesai</text>
</svg>
