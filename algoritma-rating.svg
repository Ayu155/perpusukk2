<svg viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="900" fill="#FFFFFF"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1E293B">Algoritma Rating &amp; Ulasan</text>

  <rect x="150" y="45" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="260" y="76" text-anchor="middle" font-size="15" fill="#FFFFFF">Mulai</text>
  <line x1="260" y1="95" x2="260" y2="130" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="60" y="130" width="400" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="160" text-anchor="middle" font-size="14" fill="#1E293B">Siswa membuka halaman detail buku</text>
  <line x1="260" y1="180" x2="260" y2="215" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <polygon points="260,215 430,300 260,385 90,300" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="260" y="288" text-anchor="middle" font-size="12.5" fill="#78350F">Pernah meminjam &amp;</text>
  <text x="260" y="306" text-anchor="middle" font-size="12.5" fill="#78350F">mengembalikan buku</text>
  <text x="260" y="324" text-anchor="middle" font-size="12.5" fill="#78350F">ini?</text>

  <line x1="260" y1="385" x2="260" y2="420" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="405" font-size="12" fill="#334155">Ya</text>

  <line x1="430" y1="300" x2="500" y2="300" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="435" y="290" font-size="12" fill="#334155">Tidak</text>
  <rect x="500" y="270" width="200" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="600" y="295" text-anchor="middle" font-size="12.5" fill="#7F1D1D">"Anda belum</text>
  <text x="600" y="313" text-anchor="middle" font-size="12.5" fill="#7F1D1D">meminjam buku ini"</text>
  <line x1="600" y1="330" x2="600" y2="365" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="500" y="365" width="200" height="50" rx="25" fill="#4F46E5"/>
  <text x="600" y="396" text-anchor="middle" font-size="14" fill="#FFFFFF">Selesai</text>

  <rect x="90" y="420" width="340" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="450" text-anchor="middle" font-size="14" fill="#1E293B">Input rating &amp; komentar</text>
  <line x1="260" y1="470" x2="260" y2="505" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="505" width="360" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="535" text-anchor="middle" font-size="14" fill="#1E293B">Simpan ke tabel "ulasan"</text>
  <line x1="260" y1="555" x2="260" y2="590" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="590" width="440" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="620" text-anchor="middle" font-size="14" fill="#1E293B">Hitung ulang rata-rata rating buku</text>
  <line x1="260" y1="640" x2="260" y2="675" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="40" y="675" width="440" height="50" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="705" text-anchor="middle" font-size="14" fill="#1E293B">Update tampilan rating di halaman</text>
  <line x1="260" y1="725" x2="260" y2="760" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="150" y="760" width="220" height="50" rx="25" fill="#4F46E5"/>
  <text x="260" y="791" text-anchor="middle" font-size="15" fill="#FFFFFF">Selesai</text>
</svg>
